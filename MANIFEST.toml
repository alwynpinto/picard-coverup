uuid = "be95dccc-b521-488a-843f-4af29033de41"
name = "CoverUp"
description = "Find, compare and apply album artwork from many sources, as embedded tags and/or files."
long_description = """
CoverUp searches several artwork sources (Cover Art Archive, Discogs, Fanart.tv and more),
matches the exact release first, falls back to visual consensus across sources, and lets you
choose which art types (front, back, disc, booklet, artist) to apply, as embedded tags,
as files in a folder you name, or both. Includes logging for troubleshooting.

Right-click an album: "CoverUp: Find artwork…", "CoverUp: Auto-apply", "CoverUp: Undo last apply".
"""
